<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scratch</title>
    <link rel="apple-touch-icon" href="icons/scratch-192.png" />
    <script>
      // Match theme.ts: explicit light/dark wins, otherwise follow the OS.
      (() => {
        let preference = 'system'
        try {
          const stored = localStorage.getItem('scratch-theme')
          if (stored === 'light' || stored === 'dark') preference = stored
        } catch { /* Storage can be unavailable. */ }
        const dark = matchMedia('(prefers-color-scheme: dark)').matches
        const resolved = preference === 'system' ? (dark ? 'dark' : 'light') : preference
        document.documentElement.dataset.theme = resolved
        document.documentElement.style.colorScheme = resolved
      })()
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
